<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Strata Mixer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* DEFAULT / primary look: pure cinematic black. */
  body {
    background: #010101;   /* EXACT corner colour of cube-black-waiting.mp4 → seamless (no box) */
    color: #ffffff;
    font-family: Inter, 'Segoe UI', Arial, sans-serif;
    -webkit-user-select: none; cursor: default;
    /* Fade-out hook: __finish() flips this. */
    opacity: 1;
    transition: opacity .25s ease;
  }
  body.fade { opacity: 0; }
  body.light { background: #ecf0f9; color: #14161e; }   /* EXACT corner colour of cube-white-waiting.mp4 */

  .wrap {
    height: 100vh; box-sizing: border-box;
    display: flex; flex-direction: row; align-items: center;
    gap: 22px; padding: 0 34px 0 26px;
    position: relative;
  }

  /* Кубик mascot on the LEFT. */
  video {
    width: 96px; height: 96px; display: block;
    background: transparent; flex: 0 0 auto;
    object-fit: contain;
  }

  /* Wordmark block to the right of the cube. */
  .brand { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  h1 {
    margin: 0; font-size: 30px; line-height: 1; font-weight: 800;
    letter-spacing: .35em; text-indent: .35em; /* indent balances trailing spacing */
    white-space: nowrap; color: #ffffff;
  }
  body.light h1 { color: #14161e; }

  /* THE BAR: thin, real progress, brand gradient. */
  .bar {
    margin-top: 18px;
    align-self: stretch; height: 3px;   /* match the wordmark's full width exactly */
    background: rgba(255,255,255,.10);
    border-radius: 99px; overflow: hidden;
  }
  body.light .bar { background: rgba(20,22,30,.12); }
  .bar i {
    display: block; height: 100%; width: 8%;
    background: linear-gradient(90deg, #ff8a00, #e244c6, #a33cff);
    border-radius: 99px;
    transition: width .25s ease;
    will-change: width;
  }

  /* Muted version badge — bottom-right corner. */
  .ver {
    position: absolute; right: 14px; bottom: 11px;
    font-size: 11px; font-weight: 700; letter-spacing: .02em;
    color: rgba(255,255,255,.34);
  }
  body.light .ver { color: rgba(20,22,30,.40); }
</style>
</head>
<body>
<div class="wrap">
  <video id="cube" autoplay muted loop playsinline></video>
  <div class="brand">
    <h1>STRATA MIXER</h1>
    <div class="bar"><i id="fill"></i></div>
  </div>
  <span class="ver" id="ver">v1.1</span>
</div>
<script>
  // Hash format: "theme|version" (e.g. "light|v1.1"). Falls back to the
  // dark theme + raw version string for backward compatibility.
  var theme = 'dark', ver = 'v1.1';
  try {
    var raw = decodeURIComponent(location.hash.slice(1));
    var parts = raw.split('|');
    if (parts[0] === 'light' || parts[0] === 'dark') { theme = parts[0]; ver = parts[1] || ver; }
    else if (raw) { ver = raw; }
  } catch (e) {}
  if (theme === 'light') document.body.classList.add('light');
  var cubeName = theme === 'light' ? 'white' : 'black';
  var cube = document.getElementById('cube');
  // The splash plays the looped «waiting» clip while the app loads; on finish
  // it can be swapped to the celebration clip via __finish().
  cube.src = 'cube-' + cubeName + '-waiting.mp4';
  document.getElementById('ver').textContent = ver;

  var fill = document.getElementById('fill');
  var current = 8;            // never start empty
  fill.style.width = current + '%';

  // REAL progress: main.js calls this from load milestones (0..100).
  // Monotonic — the bar never goes backwards.
  window.__setProgress = function (p) {
    p = Math.max(0, Math.min(100, Number(p) || 0));
    if (p < current) return;
    current = p;
    fill.style.width = current + '%';
  };

  // Called right before the window is closed: swap the cube to its celebration
  // clip, snap the bar to 100%, and fade the whole splash out.
  window.__finish = function () {
    window.__setProgress(100);
    try { cube.loop = false; cube.src = 'cube-' + cubeName + '-finish.mp4'; cube.play(); } catch (e) {}
    document.body.classList.add('fade');
  };
</script>
</body>
</html>
