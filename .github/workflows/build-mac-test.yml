name: Build macOS TEST (.dmg artifact, NOT published)

# PRIVATE test build. Triggered by pushing the `mac-test` branch (or manual
# dispatch). Builds an unsigned universal .dmg and uploads it as a GitHub
# Actions ARTIFACT only — it does NOT create a release, does NOT touch
# releases/latest, and the auto-updater never sees it. Download it from the
# workflow run page (Artifacts section). Used to test Mac-only bugs we can't
# reproduce on Windows, while the public distribution stays frozen at 1.3.5.

on:
  push:
    branches:
      - mac-test
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/SHA to build from (default: the ref this is dispatched on)'
        required: false
        type: string

jobs:
  build-mac-test:
    runs-on: macos-14   # Apple Silicon; cross-compiles x64 via electron prebuilds
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer (Vite)
        run: npm run build

      - name: Prepare bundled ffmpeg (macOS binary from ffmpeg-static)
        run: npm run prepare-ffmpeg

      - name: Bake Groq API key into the build (from repo secret)
        run: npm run bake-groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Build universal .dmg (unsigned, NO publish)
        run: npx electron-builder --mac --universal --publish never
        env:
          # Unsigned build — skip Apple cert auto-discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload .dmg as artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrataMixer-mac-test-dmg
          path: release-installer/*.dmg
          if-no-files-found: error
          retention-days: 14
